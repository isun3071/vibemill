[project]
name = "vibemill"
version = "0.0.1"
description = "An app machine. Grinds vibes into apps."
authors = [{ name = "Ian Sun" }]
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27,<0.28",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlmodel>=0.0.16,<0.1",
    "feedparser>=6.0,<7",
    "playwright>=1.44,<2",
    "gitpython>=3.1,<4",
    "supabase>=2.5,<3",
    "click>=8.1,<9",
    "rich>=13.7,<14",
    "tenacity>=8.3,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.4,<0.5",
    "mypy>=1.10,<2",
]

[project.scripts]
vibemill = "vibemill.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibemill"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
